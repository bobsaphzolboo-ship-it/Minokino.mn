<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<title>ОРОН — тоглуулагч жишээ</title>
<style>
  body{background:#0A0C14; color:#F2EFE4; font-family:sans-serif; padding:24px;}
  h1{font-size:20px; margin-bottom:16px;}
  video{width:100%; max-width:640px; border-radius:8px; background:#000;}
  .movie-list{display:flex; gap:12px; margin-top:20px; flex-wrap:wrap;}
  .movie-card{
    background:#171B27; border:1px solid #2a2f3d; border-radius:8px;
    padding:12px 16px; cursor:pointer; font-size:14px;
  }
  .movie-card:hover{border-color:#D9A441;}
</style>
</head>
<body>

<h1>Видео тоглуулагч (жишээ)</h1>
<video id="player" controls></video>

<div class="movie-list" id="movie-list">Ачааллаж байна...</div>

<script>
  const video = document.getElementById('player');
  const list = document.getElementById('movie-list');

  // Backend-ээс кино жагсаалт татах
  fetch('/api/movies')
    .then(res => res.json())
    .then(movies => {
      list.innerHTML = '';
      movies.forEach(m => {
        const card = document.createElement('div');
        card.className = 'movie-card';
        card.textContent = `${m.title} (${m.year})`;
        card.onclick = () => {
          // Энэ URL руу хандахад server.js доторх /stream/:id
          // endpoint нь видеог хэсэгчлэн (range) дамжуулна
          video.src = `/stream/${m.id}`;
          video.play();
        };
        list.appendChild(card);
      });
    })
    .catch(() => {
      list.textContent = 'Кино жагсаалт татахад алдаа гарлаа';
    });
</script>

</body>
</html>
